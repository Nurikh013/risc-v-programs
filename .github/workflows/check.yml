name: Check RARS examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify RARS 1.6
        run: |
          curl --fail --location --retry 3 https://github.com/TheThirdOne/rars/releases/download/v1.6/rars1_6.jar --output "$RUNNER_TEMP/rars1_6.jar"
          echo "780f730eb457b1ba609e968accc2c8b77d8f92c3d9dbf30cc7fdb3cfb14e8c24  $RUNNER_TEMP/rars1_6.jar" | sha256sum --check
      - name: Check defaults and boundary cases
        run: python tests/check.py "$RUNNER_TEMP/rars1_6.jar"
